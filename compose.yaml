name: capstone
services:
  redis:
    image: redis:7.4-alpine
    user: "999:999"
    command: [redis-server, --save, "", --appendonly, "no"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [capstone]
  capstone-service:
    build: ../backend/capstone-service
    env_file: ../backend/capstone-service/.env
    environment:
      BIND_HOST: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      UPLOAD_DIR: /app/data/uploads
    volumes: [capstone-uploads:/app/data/uploads]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [capstone]
  auth-service:
    build: ../backend/auth-service
    env_file: ../backend/auth-service/.env
    environment:
      BIND_HOST: 0.0.0.0
      USER_SERVICE_URL: http://user-service:8082
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [capstone]
  user-service:
    build: ../backend/user-service
    env_file: ../backend/user-service/.env
    environment:
      BIND_HOST: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:8081
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [capstone]
  api-gateway:
    build: ../backend/api-gateway
    env_file: ../backend/api-gateway/.env
    environment:
      BIND_HOST: 0.0.0.0
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      ALLOWED_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      CAPSTONE_SERVICE_URL: http://capstone-service:8083
      REDIS_URL: redis://redis:6379/0
    depends_on:
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
      capstone-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [capstone]
  frontend:
    build: ../frontend
    environment:
      NUXT_GATEWAY_URL: http://api-gateway:8080
      HOST: 0.0.0.0
      PORT: 3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [capstone]
  seed-admin:
    image: python:3.12-alpine
    profiles: [init]
    working_dir: /workspace
    volumes:
      - ./scripts:/workspace/infrastructure/scripts:ro
      - ./.env:/workspace/infrastructure/.env:ro
    environment:
      USER_SERVICE_URL: http://user-service:8082
    command: [python, infrastructure/scripts/seed_admin.py]
    depends_on:
      auth-service: { condition: service_healthy }
      user-service: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [capstone]
networks:
  capstone:
    driver: bridge
volumes:
  capstone-uploads:
